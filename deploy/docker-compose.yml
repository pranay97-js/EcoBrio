version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecobrio-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecobrio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecobriosecret}
      POSTGRES_DB: ${POSTGRES_DB:-ecobrio_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ecobrio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecobrio} -d ${POSTGRES_DB:-ecobrio_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecobrio-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-ecobrioredis}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ecobrio_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ecobrioredis}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  localstack:
    image: localstack/localstack:latest
    container_name: ecobrio-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs
      - AWS_DEFAULT_REGION=us-east-1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh"
      - ecobrio_localstack:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: ecobrio-prometheus
    ports:
      - "9090:9090"
    volumes:
      - "./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml"
      - ecobrio_promdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - postgres
      - redis

  grafana:
    image: grafana/grafana:latest
    container_name: ecobrio-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - ecobrio_grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  ecobrio_pgdata:
  ecobrio_redisdata:
  ecobrio_localstack:
  ecobrio_promdata:
  ecobrio_grafanadata:
