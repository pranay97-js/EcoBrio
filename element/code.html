<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_8 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_8" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_8');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.set(0, 0, 8.2);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Deep lighting with multi-spectral colors
const ambientLight = new THREE.AmbientLight(0x062820, 3.0);
scene.add(ambientLight);

const pointLight1 = new THREE.PointLight(0x00c897, 5.0, 70);
pointLight1.position.set(7, 7, 6);
scene.add(pointLight1);

const pointLight2 = new THREE.PointLight(0xc7f464, 3.5, 60);
pointLight2.position.set(-7, -6, 5);
scene.add(pointLight2);

const pointLight3 = new THREE.PointLight(0x38bdf8, 3.0, 50);
pointLight3.position.set(0, -6, 5);
scene.add(pointLight3);

// 1. Central Holographic Earth Core
const globeGroup = new THREE.Group();
scene.add(globeGroup);

// Realistic deep sphere with wireframe radar scan
const sphereGeo = new THREE.SphereGeometry(2.15, 64, 64);
const sphereMat = new THREE.MeshPhongMaterial({
  color: 0x051d17,
  emissive: 0x02110d,
  shininess: 65,
  specular: 0x00c897
});
const earthMesh = new THREE.Mesh(sphereGeo, sphereMat);
globeGroup.add(earthMesh);

// Hex / Atmospheric scanning mantle
const atmosGeo = new THREE.SphereGeometry(2.2, 36, 36);
const atmosMat = new THREE.MeshBasicMaterial({
  color: 0x00c897,
  wireframe: true,
  transparent: true,
  opacity: 0.18
});
const atmosMesh = new THREE.Mesh(atmosGeo, atmosMat);
globeGroup.add(atmosMesh);

// Outer luminous halo ring
const haloGeo = new THREE.RingGeometry(2.24, 2.32, 64);
const haloMat = new THREE.MeshBasicMaterial({
  color: 0x00c897,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 0.25
});
const halo = new THREE.Mesh(haloGeo, haloMat);
halo.rotation.x = Math.PI / 2.2;
globeGroup.add(halo);

// Geospatial Multi-Stream Hub Nodes
const hubGroup = new THREE.Group();
globeGroup.add(hubGroup);

const hubCoords = [
  { lat: 37.77, lon: -122.41, color: 0x38bdf8, name: "SF Plastics" },
  { lat: 40.71, lon: -74.00, color: 0x10b981, name: "NYC Organics" },
  { lat: 51.50, lon: -0.12, color: 0xa855f7, name: "London E-Waste" },
  { lat: 35.67, lon: 139.65, color: 0x06b6d4, name: "Tokyo Glass" },
  { lat: 1.35, lon: 103.81, color: 0xf59e0b, name: "Singapore Metals" },
  { lat: 28.61, lon: 77.20, color: 0xeab308, name: "Delhi Paper" },
  { lat: -33.86, lon: 151.20, color: 0xef4444, name: "Sydney Hazardous" },
  { lat: 52.52, lon: 13.40, color: 0xc7f464, name: "Berlin Bio" }
];

function latLonToVector3(lat, lon, radius) {
  const phi = (90 - lat) * (Math.PI / 180);
  const theta = (lon + 180) * (Math.PI / 180);
  const x = -(radius * Math.sin(phi) * Math.cos(theta));
  const z = radius * Math.sin(phi) * Math.sin(theta);
  const y = radius * Math.cos(phi);
  return new THREE.Vector3(x, y, z);
}

const hubNodes = [];
hubCoords.forEach((coord) => {
  const pos = latLonToVector3(coord.lat, coord.lon, 2.22);
  const beaconGeo = new THREE.SphereGeometry(0.065, 12, 12);
  const beaconMat = new THREE.MeshBasicMaterial({ color: coord.color });
  const beacon = new THREE.Mesh(beaconGeo, beaconMat);
  beacon.position.copy(pos);
  hubGroup.add(beacon);

  const ringGeo = new THREE.RingGeometry(0.09, 0.16, 16);
  const ringMat = new THREE.MeshBasicMaterial({
    color: coord.color,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.85
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.copy(pos);
  ring.lookAt(0, 0, 0);
  hubGroup.add(ring);
  hubNodes.push({ beacon, ring });
});

// Connecting Curved Trajectories between Hubs
const curveMat = new THREE.LineBasicMaterial({
  color: 0x00c897,
  transparent: true,
  opacity: 0.5
});
for (let i = 0; i < hubCoords.length - 1; i++) {
  const p1 = latLonToVector3(hubCoords[i].lat, hubCoords[i].lon, 2.22);
  const p2 = latLonToVector3(hubCoords[i + 1].lat, hubCoords[i + 1].lon, 2.22);
  const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5).multiplyScalar(1.42);
  const curve = new THREE.QuadraticBezierCurve3(p1, mid, p2);
  const points = curve.getPoints(24);
  const curveGeo = new THREE.BufferGeometry().setFromPoints(points);
  const line = new THREE.Line(curveGeo, curveMat);
  hubGroup.add(line);
}

// 2. Multi-Tiered Circular Economy Orbital Rings
const ringsGroup = new THREE.Group();
scene.add(ringsGroup);

const r1Geo = new THREE.TorusGeometry(3.2, 0.022, 16, 140);
const r1Mat = new THREE.MeshBasicMaterial({ color: 0x00c897, transparent: true, opacity: 0.85 });
const r1Mesh = new THREE.Mesh(r1Geo, r1Mat);
r1Mesh.rotation.x = Math.PI / 3.1;
r1Mesh.rotation.y = Math.PI / 5.2;
ringsGroup.add(r1Mesh);

const r2Geo = new THREE.TorusGeometry(3.65, 0.018, 16, 140);
const r2Mat = new THREE.MeshBasicMaterial({ color: 0xc7f464, transparent: true, opacity: 0.65 });
const r2Mesh = new THREE.Mesh(r2Geo, r2Mat);
r2Mesh.rotation.x = -Math.PI / 3.6;
r2Mesh.rotation.y = -Math.PI / 4.4;
ringsGroup.add(r2Mesh);

const r3Geo = new THREE.TorusGeometry(4.1, 0.014, 16, 140);
const r3Mat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.5 });
const r3Mesh = new THREE.Mesh(r3Geo, r3Mat);
r3Mesh.rotation.x = Math.PI / 5.8;
r3Mesh.rotation.z = Math.PI / 2.9;
ringsGroup.add(r3Mesh);

// 3. Realistic 3D Universal Waste Stream Models in Dynamic Orbit
const streamItemsGroup = new THREE.Group();
scene.add(streamItemsGroup);

// Item 1: PET Plastic Bottle (Polymer Stream - Cyan Glow)
const bottleGroup = new THREE.Group();
const bottleBodyGeo = new THREE.CylinderGeometry(0.13, 0.13, 0.38, 16);
const bottleNeckGeo = new THREE.CylinderGeometry(0.06, 0.13, 0.15, 16);
const bottleMat = new THREE.MeshPhongMaterial({ color: 0x38bdf8, emissive: 0x0369a1, transparent: true, opacity: 0.85, shininess: 100 });
const bBody = new THREE.Mesh(bottleBodyGeo, bottleMat);
const bNeck = new THREE.Mesh(bottleNeckGeo, bottleMat);
bNeck.position.y = 0.24;
bottleGroup.add(bBody);
bottleGroup.add(bNeck);
bottleGroup.position.set(3.1, 1.5, 0.7);
streamItemsGroup.add(bottleGroup);

// Item 2: Aluminum Beverage Can (Metal Stream - Lime Gold)
const canGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.42, 20);
const canMat = new THREE.MeshPhongMaterial({ color: 0xc7f464, emissive: 0x4d7c0f, shininess: 95 });
const canMesh = new THREE.Mesh(canGeo, canMat);
canMesh.position.set(-3.0, 1.8, 0.9);
streamItemsGroup.add(canMesh);

// Item 3: Corrugated Cardboard Shipping Box (Paper & Pulp - Warm Amber)
const boxGeo = new THREE.BoxGeometry(0.4, 0.36, 0.4);
const boxMat = new THREE.MeshPhongMaterial({ color: 0xd97706, emissive: 0x92400e, shininess: 35 });
const boxMesh = new THREE.Mesh(boxGeo, boxMat);
boxMesh.position.set(-3.0, -1.6, 0.8);
streamItemsGroup.add(boxMesh);

// Item 4: Organic Biowaste / Apple Fruit (Organic Stream - Emerald Green)
const bioGroup = new THREE.Group();
const bioGeo = new THREE.SphereGeometry(0.22, 16, 16);
const bioMat = new THREE.MeshPhongMaterial({ color: 0x10b981, emissive: 0x065f46, shininess: 45 });
const bioMesh = new THREE.Mesh(bioGeo, bioMat);
bioGroup.add(bioMesh);
// Add small stem
const stemGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.1, 8);
const stemMat = new THREE.MeshBasicMaterial({ color: 0x064e3b });
const stem = new THREE.Mesh(stemGeo, stemMat);
stem.position.y = 0.22;
bioGroup.add(stem);
bioGroup.position.set(3.0, -1.4, 1.0);
streamItemsGroup.add(bioGroup);

// Item 5: E-Waste Semiconductor / Microprocessor PCB (E-Waste - High Tech Purple/Teal)
const chipGroup = new THREE.Group();
const chipGeo = new THREE.BoxGeometry(0.45, 0.45, 0.06);
const chipMat = new THREE.MeshPhongMaterial({ color: 0x8b5cf6, emissive: 0x4c1d95, wireframe: false, shininess: 80 });
const chipMesh = new THREE.Mesh(chipGeo, chipMat);
chipGroup.add(chipMesh);
const dieGeo = new THREE.BoxGeometry(0.22, 0.22, 0.08);
const dieMat = new THREE.MeshPhongMaterial({ color: 0x00c897, emissive: 0x00c897, shininess: 120 });
const dieMesh = new THREE.Mesh(dieGeo, dieMat);
chipGroup.add(dieMesh);
chipGroup.position.set(0.3, 3.2, 0.6);
streamItemsGroup.add(chipGroup);

// Item 6: Glass Cullet / Prism Flask (Glass Stream - Laser Cyan Glass)
const glassGeo = new THREE.OctahedronGeometry(0.26, 0);
const glassMat = new THREE.MeshPhongMaterial({ color: 0x06b6d4, emissive: 0x083344, transparent: true, opacity: 0.75, wireframe: true, shininess: 110 });
const glassMesh = new THREE.Mesh(glassGeo, glassMat);
glassMesh.position.set(0.2, -3.2, 0.8);
streamItemsGroup.add(glassMesh);

// 4. Data Particle Cloud & Floating Recovery Nodes
const pCount = 380;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(pCount * 3);
const pColors = new Float32Array(pCount * 3);

for (let i = 0; i < pCount; i++) {
  const r = 2.9 + Math.random() * 2.8;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos((Math.random() * 2) - 1);
  pPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
  pPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
  pPos[i * 3 + 2] = r * Math.cos(phi);

  if (i % 4 === 0) {
    pColors[i * 3] = 0.0; pColors[i * 3 + 1] = 0.78; pColors[i * 3 + 2] = 0.59; // emerald
  } else if (i % 4 === 1) {
    pColors[i * 3] = 0.78; pColors[i * 3 + 1] = 0.95; pColors[i * 3 + 2] = 0.39; // lime
  } else if (i % 4 === 2) {
    pColors[i * 3] = 0.22; pColors[i * 3 + 1] = 0.74; pColors[i * 3 + 2] = 0.97; // cyan
  } else {
    pColors[i * 3] = 0.54; pColors[i * 3 + 1] = 0.36; pColors[i * 3 + 2] = 0.96; // purple
  }
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));

const pMat = new THREE.PointsMaterial({
  size: 0.045,
  vertexColors: true,
  transparent: true,
  opacity: 0.85
});
const particles = new THREE.Points(pGeo, pMat);
scene.add(particles);

// Mouse Interaction
let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;
window.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX / window.innerWidth) * 2 - 1;
  mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Globe slow rotation
  globeGroup.rotation.y = t * 0.12;

  // Orbital rings continuous tilt & rotation
  r1Mesh.rotation.z = t * 0.15;
  r2Mesh.rotation.z = -t * 0.13;
  r3Mesh.rotation.y = t * 0.17;

  // Floating waste stream items with natural organic bobbing & tumbling
  bottleGroup.position.y = 1.5 + Math.sin(t * 1.5) * 0.14;
  bottleGroup.rotation.x = t * 0.4;
  bottleGroup.rotation.z = t * 0.3;

  canMesh.position.y = 1.8 + Math.cos(t * 1.4) * 0.15;
  canMesh.rotation.y = t * 0.45;
  canMesh.rotation.x = t * 0.25;

  boxMesh.position.y = -1.6 + Math.sin(t * 1.6) * 0.12;
  boxMesh.rotation.y = -t * 0.3;
  boxMesh.rotation.x = t * 0.2;

  bioGroup.position.y = -1.4 + Math.cos(t * 1.7) * 0.14;
  bioGroup.rotation.y = t * 0.5;

  chipGroup.position.y = 3.2 + Math.sin(t * 1.3) * 0.1;
  chipGroup.rotation.y = t * 0.35;
  chipGroup.rotation.z = -t * 0.25;

  glassMesh.position.y = -3.2 + Math.cos(t * 1.5) * 0.12;
  glassMesh.rotation.x = t * 0.4;
  glassMesh.rotation.y = t * 0.3;

  // Pulse hub rings
  hubNodes.forEach((node, idx) => {
    const scale = 1 + Math.sin(t * 3.5 + idx) * 0.35;
    node.ring.scale.set(scale, scale, scale);
  });

  // Particles rotation
  particles.rotation.y = t * 0.035;

  // Smooth mouse parallax
  targetX += (mouseX * 0.45 - targetX) * 0.06;
  targetY += (mouseY * 0.45 - targetY) * 0.06;
  scene.rotation.y = targetX;
  scene.rotation.x = -targetY;

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  const newW = container.clientWidth || window.innerWidth;
  const newH = container.clientHeight || window.innerHeight;
  camera.aspect = newW / newH;
  camera.updateProjectionMatrix();
  renderer.setSize(newW, newH);
});
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_8 -->


</body></html>
